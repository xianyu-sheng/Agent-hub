[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub"
version = "0.1.0"
description = "Multi-Agent orchestration system with LLM intent routing, DAG scheduling & 7 collaboration strategies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Xianyu Sheng", url = "https://github.com/xianyu-sheng"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/xianyu-sheng/Agent-hub"
Repository = "https://github.com/xianyu-sheng/Agent-hub"
Issues = "https://github.com/xianyu-sheng/Agent-hub/issues"

[project.scripts]
agent-hub = "agent_hub.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["agent_hub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
